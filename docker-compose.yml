services:
  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: radicale
    restart: unless-stopped
    environment:
      UID: "2999"
      GID: "2999"
    volumes:
      - ./docker/radicale/config:/etc/radicale/config:ro
      - ./docker/radicale/users:/etc/radicale/users:ro
      - radicale-data:/data
    ports:
      - "127.0.0.1:5232:5232"

  notifier:
    build:
      context: .
      dockerfile: docker/notifier/Dockerfile
    container_name: radicale-notifier
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      NOTIFIER_INTERVAL: "300"
    volumes:
      - ./docker/notifier/config.ini:/etc/radicale-notifier/config.ini:ro
      - ./docker/notifier/env:/etc/radicale-notifier/env:ro
      - notifier-state:/var/lib/radicale-notifier
    depends_on:
      - radicale

volumes:
  radicale-data:
  notifier-state:
