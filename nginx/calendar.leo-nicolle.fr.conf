# Radicale reverse proxy — HTTP-only base config.
# Run `certbot --nginx -d calendar.leo-nicolle.fr` afterward; certbot will
# add the 443/listen ssl block and the HTTP->HTTPS redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name calendar.leo-nicolle.fr;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:5232;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
